<text x="800" y="747" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#172C3D">Transport vidéo et retour local à intégrer et à tester</text>
<text x="64" y="844" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#172C3D">Délai total = capture + envoi + calcul + retour + affichage</text>
<text x="64" y="900" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#526677">La puissance du GPU ne supprime pas la latence ni les contraintes du réseau.</text>
