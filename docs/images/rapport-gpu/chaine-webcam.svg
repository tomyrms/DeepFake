<text x="1361" y="518" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#526677">Affichage ou sortie</text>
<text x="1361" y="558" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#526677">en webcam virtuelle</text>
