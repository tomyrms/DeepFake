<text x="800" y="518" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#526677">Détection · échange de visage</text>
<text x="800" y="558" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#526677">Amélioration facultative</text>
<text x="800" y="598" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#526677">Encodage du flux de retour</text>
