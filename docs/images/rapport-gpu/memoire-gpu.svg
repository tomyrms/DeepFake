<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
<rect width="1600" height="980" fill="#F4F7FA"/>
<text x="64" y="49" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700" fill="#172C3D">Deux mémoires, deux rôles différents</text>
<text x="64" y="118" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#526677">La VRAM appartient à la carte graphique ; la RAM appartient au serveur ou au PC.</text>
<rect x="64" y="196" width="712" height="594" rx="18" fill="#FFFFFF" stroke="#D7E1E8" stroke-width="1"/>
<text x="100" y="226" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#215F9B">PC ACTUEL</text>
<text x="100" y="266" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#172C3D">RTX 4070 Laptop</text>
<polyline points="100,332 740,332" fill="none" stroke="#D7E1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="364" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#172C3D">VRAM · mémoire graphique</text>
<text x="100" y="410" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="700" fill="#215F9B">≈ 8 Go</text>
<rect x="100" y="487" width="640" height="28" rx="6" fill="#E6EDF2"/>
<rect x="100" y="487" width="160.0" height="28" rx="6" fill="#215F9B"/>
<text x="100" y="538" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#526677">Modèles IA, images et calculs sur le GPU</text>
<polyline points="100,596 740,596" fill="none" stroke="#D7E1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="628" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#172C3D">RAM · mémoire du système</text>
<text x="100" y="674" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#172C3D">32 Go</text>
<text x="314" y="686" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#526677">Système et applications</text>
<rect x="824" y="196" width="712" height="594" rx="18" fill="#FFFFFF" stroke="#D7E1E8" stroke-width="1"/>
<text x="860" y="226" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#167B71">SERVEUR ENVISAGÉ</text>
<text x="860" y="266" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700" fill="#172C3D">RTX 5090</text>
<polyline points="860,332 1500,332" fill="none" stroke="#D7E1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="364" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#172C3D">VRAM · mémoire graphique</text>
<text x="860" y="410" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="51" font-weight="700" fill="#167B71">32 Go</text>
<rect x="860" y="487" width="640" height="28" rx="6" fill="#E6EDF2"/>
<rect x="860" y="487" width="640" height="28" rx="6" fill="#167B71"/>
<text x="860" y="538" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#526677">Modèles IA, images et calculs sur le GPU</text>
<polyline points="860,596 1500,596" fill="none" stroke="#D7E1E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="860" y="628" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#172C3D">RAM · mémoire du système</text>
<text x="860" y="674" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#172C3D">32–64 Go</text>
<text x="1074" y="686" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#526677">Système et applications</text>
<text x="64" y="827" dominant-baseline="text-before-edge" text-anchor="start" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#526677">Les barres comparent uniquement la capacité de VRAM : environ 4 fois plus.</text>
<rect x="64" y="885" width="1472" height="60" rx="10" fill="#E8EEF4"/>
<text x="800" y="898" dominant-baseline="text-before-edge" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#172C3D">Capacité mémoire ≠ qualité ou FPS garantis</text>
</svg>